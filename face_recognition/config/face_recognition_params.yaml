# ROS2 Parameters for Face Recognition Node
# This file contains all the configurable parameters for the FaceRecognitionNode

face_recognition_node:
  ros__parameters:
    # Topic Configuration
    input_topic: "/humans/faces/detected"
    output_topic: "/humans/faces/recognized"
    image_input_topic: "/camera/color/image_rect_raw"
    compressed_topic: ""
    
    # Processing Configuration
    processing_rate_hz: 30.0
    device: "cuda:0"
    
    # Face Embedding Model Configuration
    face_embedding_model: "vggface2"
    face_embedding_weights_name: "20180402-114759-vggface2.pt"

    # Face Alignment
    # When enabled, each face crop is rotated before embedding so that both eyes
    # are on the same horizontal line.  Uses only OpenCV + YOLO pupil landmarks
    enable_face_alignment: True
    # Embedding crop: "aligned" = 5-point similarity warp to the standard template (entry 3 of
    # docs/identity_experiments.md: margin p10 0.27 -> 0.37 vs box crops), "bbox" = detection box
    crop_mode: "aligned"
    aligned_crop_size: 160       # FaceNet input size
    
    # Detection / image pairing: crops always come from the frame the detector saw
    image_buffer_size: 30        # Recent frames kept to find the one matching a detection stamp
    image_sync_timeout: 0.5      # Seconds to wait for that frame before reusing cached results

    # Face quality gate: who may create or teach an identity
    # Quality 0..1 from detection confidence and yaw (inter-ocular distance / face width).
    # Measured on video_3.mp4: eye ratio 0.06-0.14 (3/4 -> profile) matches the right person
    # only 73-96% of the time; >= 0.14 is 97-99%. Hand false positives have confidence <= 0.25.
    min_detection_confidence: 0.40
    profile_eye_ratio: 0.10      # Eye ratio at or below this -> quality 0 (profile)
    frontal_eye_ratio: 0.18      # Eye ratio at or above this -> full quality
    min_learn_quality: 0.50      # Faces below this can match a known identity but never create/teach one

    # Identity Management Configuration (rules ported from speech diarization)
    similarity_threshold: 0.50           # Match bar for confirmed identities
    young_identity_threshold: 0.40       # Relaxed match bar for tentative identities (noisy mean)
    match_margin: 0.08                   # Best must beat second-best by this much, else unlabeled
    track_identity_stickiness_margin: 0.20  # Track keeps its identity unless another is this much better
    merge_threshold: 0.50                # Pair score to merge fragments (keeps lowest U number); vetoed if ever seen together
    seed_match_threshold: 0.50           # Averaged seed joins an existing identity at this score instead of creating one
    redundancy_threshold: 0.92           # New sample this close to a stored one is not stored (diverse gallery)
    gallery_top_k: 3                     # Score = 0.5 * gallery mean + 0.5 * mean of the k closest stored samples
    merge_check_interval: 1.0            # Seconds between merge/absorb passes
    min_seed_samples: 4                  # Consistent good samples of one track needed to create an identity
    seed_consistency: 0.55               # Min similarity of every seed sample to the seed mean
    seed_pairwise_consistency: 0.40      # Min mean pairwise similarity of seed samples (rejects mixed tracks)
    min_confirm_samples: 12              # Good samples before an identity is confirmed (and persisted)
    min_confirm_seconds: 3.0             # ...spread over at least this time (long enough for strays to be absorbed)
    max_embeddings_per_identity: 100     # Gallery size; when full the most redundant sample is evicted
    identity_timeout: 30.0               # Tentative identities unseen this long are dropped (confirmed never)
    track_timeout: 2.0                   # Forget a face track id not seen for this long

    # Identity Persistence Configuration (continuous, throttled MongoDB sync)
    use_mongodb: true
    save_last_n_embeddings: 100          # Gallery samples stored per identity (whole diverse gallery)
    persist_every: 20                    # Updates before a confirmed identity is saved again...
    min_persist_interval: 10.0           # ...and at least this many seconds since its last save
    persist_flush_period: 10.0           # Background flush of pending updates

    
    # Performance Optimization
    # Percentage of frames to skip face recognition (0-100)
    # When skipping, the last cached recognition result for each face_id is reused
    # For example, 50.0 means recognize every other frame, reusing cached results for skipped frames
    recognition_frame_skip_percentage: 0.0  # Default: 0.0 no skipping (process every frame)
  
    min_h_size: 30  # Minimum height size in pixels for valid face detection (default 40)
        

    # Debug Configuration
    enable_debug_output: false
    enable_image_output: true
    img_published_reshape_size: [1080, 720]  # Resolution for published annotated images

    # Receiver Configuration
    receiver_id: "face_recognition"
    
    # ROS4HRI Configuration
    ros4hri_with_id: false
